# One command: `docker compose up --build` -> http://localhost:3000
# First boot seeds January 2026 from the committed raw cache (no Elexon needed).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: windsight
      POSTGRES_USER: windsight
      POSTGRES_PASSWORD: windsight
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windsight -d windsight"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-docker}
    environment:
      DATABASE_URL: postgresql+asyncpg://windsight:windsight@db:5432/windsight
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-docker-admin}
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8010}:8000"

  frontend:
    build:
      context: frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  pgdata:
