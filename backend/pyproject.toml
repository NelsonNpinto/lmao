[project]
name = "windsight-backend"
version = "0.1.0"
description = "WindSight: as-of wind forecast accuracy and procurement margin API over Elexon BMRS data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=2.0",
    "structlog>=24.1",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC240"]  # tiny fixture-file checks in tests
"app/domain/findings.py" = ["E501"]  # long human-readable sentences
"app/cli.py" = ["ASYNC240"]  # offline CLI: blocking file writes are fine

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "UP046",  # keep Generic[T] on pydantic models for OpenAPI naming stability
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.api.*"]
strict = true

[tool.coverage.run]
source = ["app"]
branch = true
